[package]
name = "rust-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# gRPC y Protobuf
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

# Cliente HTTP
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
# Para compilar el .proto automáticamente
tonic-build = "0.12"