apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackfriday-ingress
  annotations:
    # nginx.ingress.kubernetes.io/rewrite-target:
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Para evitar líos con https
spec:
  ingressClassName: public
  rules:
  - host: ventas.so1
    http:
      paths:
      - path: /venta
        pathType: Prefix
        backend:
          service:
            name: rust-api-service
            port:
              number: 80