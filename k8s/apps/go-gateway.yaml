apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-gateway
  template:
    metadata:
      labels:
        app: go-gateway
    spec:
      containers:
      - name: go-gateway
        image: 3.133.84.214:5000/go-gateway:v-final
        ports:
        - containerPort: 3000
        env:
        - name: GRPC_HOST
          value: "go-worker-service:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: go-gateway-service
spec:
  selector:
    app: go-gateway
  ports:
  - port: 3000
    targetPort: 3000