apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-gateway
  template:
    metadata:
      labels:
        app: go-gateway
    spec:
      containers:
      - name: go-gateway
        image: 3.131.135.47:5000/go-gateway:v1
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: go-gateway-service
spec:
  selector:
    app: go-gateway
  ports:
  - port: 3000
    targetPort: 3000