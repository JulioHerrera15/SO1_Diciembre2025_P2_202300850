apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-worker
  template:
    metadata:
      labels:
        app: go-worker
    spec:
      containers:
      - name: go-worker
        image: 3.131.135.47:5000/go-worker:v1
        ports:
        - containerPort: 50051
        env:
        - name: KAFKA_BROKER_URL
          value: "my-cluster-kafka-brokers.kafka.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: go-worker-service
spec:
  selector:
    app: go-worker
  ports:
  - port: 50051
    targetPort: 50051