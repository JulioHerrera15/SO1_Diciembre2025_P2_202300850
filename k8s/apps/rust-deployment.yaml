apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
      - name: rust-api
        image: 3.133.84.214:5000/rust-api:v1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"  # Solicita 10% de un núcleo
            memory: "64Mi"
          limits:
            cpu: "250m"  # Límite duro de 25%
            memory: "128Mi"
        env:
        - name: GO_SERVICE_URL
          value: "http://go-gateway-service:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: rust-api-service
spec:
  type: NodePort
  selector:
    app: rust-api
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30001 # Exponemos puerto para probar fácil