apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
      - name: rust-api
        image: 3.131.135.47:5000/rust-api:v1
        ports:
        - containerPort: 8080
        env:
        - name: GO_SERVICE_URL
          value: "http://go-gateway-service:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: rust-api-service
spec:
  type: NodePort
  selector:
    app: rust-api
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30001 # Exponemos puerto para probar fácil